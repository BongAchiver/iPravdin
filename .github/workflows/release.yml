name: Sign and release iPravdin

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New Firefox version, for example 2.0.2 (must be higher than the installed version)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ipravdin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$REPOSITORY" --jq .private)" = false || {
            echo 'This workflow needs a public repository so Firefox can download releases without GitHub credentials. For a private repository use a separate HTTPS host.'
            exit 1
          }
      - run: npm ci
      - name: Configure release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          npm run version:set -- "$RELEASE_VERSION"
          npm run updates:configure -- "https://github.com/$REPOSITORY/releases/latest/download/updates.json"
      - run: npm test
      - run: npm run lint
      - name: Sign with Mozilla (unlisted)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET" || {
            echo 'Configure AMO_JWT_ISSUER and AMO_JWT_SECRET in repository Actions secrets.'
            exit 1
          }
          npm run sign
      - name: Prepare update manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: npm run updates:prepare -- "https://github.com/$REPOSITORY/releases/download/v$RELEASE_VERSION/ipravdin.xpi"
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/release/ipravdin.xpi dist/release/updates.json \
            --target "$COMMIT" --title "iPravdin $RELEASE_VERSION" \
            --notes 'Signed Firefox extension for self-distribution. Install ipravdin.xpi from about:addons. Future updates use updates.json.' --latest
